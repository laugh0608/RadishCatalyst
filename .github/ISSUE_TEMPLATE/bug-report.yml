name: 缺陷报告
description: 报告可复现的玩法、客户端、存档、文档或工具问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞、真实凭据、个人数据或未脱敏存档不要写入公开 Issue。请阅读 SECURITY.md 并使用 Private Vulnerability Reporting。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认这不是需要私下报告的安全漏洞
          required: true
        - label: 我已搜索现有 Issue，并阅读当前阶段和相关专题
          required: true
        - label: 我没有附带真实凭据、个人数据、未脱敏存档或无权使用的第三方材料
          required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 简明说明实际问题、玩家或开发影响。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 提供 commit、平台、Godot 版本、存档 schema 和相关配置；不要粘贴敏感数据。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 从正式入口或最小测试条件开始，列出可重复的操作与前置状态。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与证据
      description: 附上已脱敏的日志、截图或录像，并说明证据没有覆盖的范围。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 风险、临时缓解与补充信息
      description: 说明是否影响主流程、存读、玩家财产、兼容性或可重复验证。
