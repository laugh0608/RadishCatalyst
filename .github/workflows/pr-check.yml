name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - master
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check text files
        shell: bash
        run: ./scripts/check-text-files.sh

      - name: Check docs
        shell: bash
        run: ./scripts/check-docs.sh

      - name: Check client static data
        shell: bash
        run: python3 scripts/check-client-data.py .

      - name: Check client scene references
        shell: bash
        run: python3 scripts/check-client-scenes.py .

      - name: Check committed diff whitespace
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
